[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short -m \"not live\""
asyncio_mode = "auto"
markers = [
    "live: hits a real LLM provider, excluded from default runs",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
