# Reference manifest, not tuned to any specific cluster. Values (replica
# counts, resource requests) are starting points to adjust after real load
# testing -- see docs/PRODUCTION.md for the latency/throughput discussion
# that should drive these numbers in a real deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-copilot-backend
  labels:
    app: signal-copilot-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: signal-copilot-backend
  template:
    metadata:
      labels:
        app: signal-copilot-backend
    spec:
      containers:
        - name: backend
          image: signal-copilot-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: LLM_PROVIDER
              value: "openai"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: signal-copilot-secrets
                  key: openai-api-key
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: signal-copilot-backend
spec:
  selector:
    app: signal-copilot-backend
  ports:
    - port: 80
      targetPort: 8000
  # ClusterIP + an Ingress (not shown here, cluster-specific) that supports
  # WebSocket upgrade (nginx-ingress: `nginx.ingress.kubernetes.io/proxy-read-timeout`
  # raised well above the default, since a live-call WebSocket connection
  # is long-lived) is the recommended front door -- see docs/PRODUCTION.md.
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: signal-copilot-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: signal-copilot-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    # Scaling on active WebSocket session count (a custom metric scraped
    # from /metrics via a Prometheus adapter) rather than CPU%, because
    # this workload is I/O-bound waiting on LLM calls -- CPU stays low even
    # under heavy concurrent-session load, so CPU-based autoscaling would
    # under-scale exactly when it matters. See docs/PRODUCTION.md.
    - type: Pods
      pods:
        metric:
          name: copilot_active_sessions
        target:
          type: AverageValue
          averageValue: "25"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: signal-copilot-backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: signal-copilot-backend
